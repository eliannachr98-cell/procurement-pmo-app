name: Refresh market facts

# (Re)creates the ready-made Αγορά / Ανταγωνισμός tables (sql/market_facts.sql),
# fills them with refresh_market_facts() and prints a comparison against
# market_overview_cache so the numbers can be checked. Statement timeout is off
# here; the Supabase SQL editor would time out.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-facts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "psycopg[binary]>=3.2,<4"
      - name: Create tables, refresh, compare
        env:
          DATABASE_URL: ${{ secrets.COMPACT_DATABASE_URL }}
          EXPECTED_DB_REF: gunzsfttzijoxteppskb
        shell: python
        run: |
          import os, time, json
          import psycopg

          url = os.environ["DATABASE_URL"]
          if os.environ["EXPECTED_DB_REF"] not in url:
              raise SystemExit("DATABASE_URL does not point at the expected Supabase project")
          with psycopg.connect(url, prepare_threshold=None, autocommit=True) as conn, conn.cursor() as cur:
              cur.execute("set statement_timeout = 0")
              cur.execute(open("sql/market_facts.sql", encoding="utf-8").read())
              print("sql applied")
              cur.execute(open("sql/competitor_overview.sql", encoding="utf-8").read())
              print("competitor_overview applied")
              started = time.time()
              cur.execute("select public.refresh_market_facts()")
              print(f"facts refreshed in {time.time() - started:.0f}s")
              cur.execute("select (select count(*) from public.market_tender_facts), (select count(*) from public.market_contractor_facts)")
              print("rows (tenders, contractor rows):", cur.fetchone())

              keys = ["tenders", "tendersWithAwards", "contractors", "awards", "contracts", "value", "awardsValue", "contractsValue", "concentrationTop5"]
              for year in ("2025", "2026"):
                  cur.execute("select payload from public.market_overview_cache where cache_key = %s", (year,))
                  row = cur.fetchone()
                  cached = row[0] if row else {}
                  started = time.time()
                  cur.execute("select public.market_overview_fast(%s)", (year,))
                  fast = cur.fetchone()[0]
                  print(f"--- {year}: fast took {time.time() - started:.1f}s")
                  for key in keys:
                      print(f"{key:20} cache={cached.get(key)}  fast={fast.get(key)}")
                  print("discount cache:", cached.get("discount"))
                  print("discount fast :", fast.get("discount"))

              cpv2 = ["79400000-8", "79410000-1"]
              for label, args in (
                  ("2 cpv", "null,null,null,null,true,null,%s,null,null,null"),
              ):
                  started = time.time()
                  cur.execute(f"select public.market_overview_fast({args})", (cpv2,))
                  out = cur.fetchone()[0]
                  print(f"{label}: tenders={out['tenders']} awards={out['awards']} contracts={out['contracts']} in {time.time() - started:.1f}s")
              cur.execute("select round(sum(amt)), round(sum(coalesce(amt_share, amt))), count(*) filter (where members > 1) from public.market_contractor_facts")
              print("contractor amounts: full per member / split by members / rows in unions:", cur.fetchone())
              started = time.time()
              cur.execute("select public.competitor_overview(%s::text[])", (["091569759", "ΙΝΕΞ", "ΕΡΝΣΤ ΚΑΙ ΓΙΑΝΓΚ"],))
              out = cur.fetchone()[0]
              print(f"competitor_overview in {time.time() - started:.1f}s")
              for item in out["competitors"]:
                  print(item["key"], item["name"], "awards", item["awards"], "contracts", item["contracts"], "value", round(item["value"] or 0), "last", item["lastDate"], "union%", item["unionShare"], "avgBudget", item["avgBudget"])
                  print("   discount", item["discount"])
                  print("   monthly", item["monthly"][-3:], "clients", item["clients"][:3])
              print("common authorities:", out["common"][:3])
              for item in out["competitors"]:
                  print("CHECK", item["name"][:30], "awards+contracts", item["awards"] + item["contracts"], "sum of clients", sum(c["count"] for c in item["clients"]), "clients", len(item["clients"]), "items", len(item["items"]))
