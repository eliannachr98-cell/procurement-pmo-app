name: Apply SQL file to compact database

on:
  workflow_dispatch:
    inputs:
      file:
        description: Path to the .sql file under sql/ to run
        required: true
        default: sql/dashboard_aggregates.sql

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database driver
        run: pip install "psycopg[binary]>=3.2,<4"
      - name: Run SQL file
        env:
          DATABASE_URL: ${{ secrets.COMPACT_DATABASE_URL }}
          SQL_FILE: ${{ inputs.file }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          path = Path(os.environ["SQL_FILE"])
          sql = path.read_text(encoding="utf-8")
          # Statements like VACUUM refuse to run inside a transaction block,
          # which a single multi-statement execute() implicitly opens -- so
          # split into one execute() per statement. Files with dollar-quoted
          # function bodies (containing ";" internally) must stay as one call.
          statements = [sql] if "$$" in sql else [s.strip() for s in sql.split(";") if s.strip()]
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as connection:
              connection.execute("set statement_timeout = '120000'")
              for statement in statements:
                  cursor = connection.execute(statement)
                  if cursor.description:
                      columns = [col.name for col in cursor.description]
                      for row in cursor.fetchall():
                          print(dict(zip(columns, row)))
          print(f"applied: {path}")
          PY
