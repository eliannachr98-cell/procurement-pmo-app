name: Load compact data for 2025

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a one-day test first, then choose full
        required: true
        type: choice
        options:
          - test
          - full
          - repair-june-11
          - repair-july-30
          - repair-auction-daily-july-30
        default: test

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(inputs.mode, 'repair-') && 'compact-2025-repair' || 'compact-2025-load' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          MODE: ${{ inputs.mode }}
        shell: python
        run: |
          import json, os
          from datetime import date, timedelta

          sources = ("notice", "auction", "contract")
          if os.environ["MODE"] == "test":
              windows = [{"date_from": "2025-01-01", "date_to": "2025-01-01", "source": source, "max_pages": 1} for source in sources]
          elif os.environ["MODE"] == "repair-june-11":
              windows = [{"date_from": "2025-06-11", "date_to": "2025-06-17", "source": "notice", "max_pages": 0}]
          elif os.environ["MODE"] == "repair-july-30":
              windows = [
                  {"date_from": "2025-07-30", "date_to": "2025-08-05", "source": source, "max_pages": 0}
                  for source in ("notice", "auction")
              ]
          elif os.environ["MODE"] == "repair-auction-daily-july-30":
              start = date(2025, 7, 30)
              windows = [
                  {
                      "date_from": (start + timedelta(days=offset)).isoformat(),
                      "date_to": (start + timedelta(days=offset)).isoformat(),
                      "source": "auction",
                      "max_pages": 0,
                  }
                  for offset in range(7)
              ]
          else:
              windows = []
              current, end = date(2025, 1, 1), date(2025, 12, 31)
              while current <= end:
                  window_end = min(current + timedelta(days=6), end)
                  for source in sources:
                      windows.append({
                          "date_from": current.isoformat(),
                          "date_to": window_end.isoformat(),
                          "source": source,
                          "max_pages": 0,
                      })
                  current = window_end + timedelta(days=1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": windows}, separators=(",", ":")) + "\n")

  load:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.source }} ${{ matrix.date_from }} to ${{ matrix.date_to }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install "requests>=2.32,<3" "psycopg[binary]>=3.2,<4"
      - name: Prepare compact data
        shell: bash
        run: |
          args=(
            --date-from "${{ matrix.date_from }}"
            --date-to "${{ matrix.date_to }}"
            --source "${{ matrix.source }}"
            --output-dir staging/compact
          )
          if [ "${{ matrix.max_pages }}" -gt 0 ]; then
            args+=(--max-pages "${{ matrix.max_pages }}")
          fi
          python -u prepare_compact_data.py "${args[@]}"
      - name: Write to the new compact database
        env:
          DATABASE_URL: ${{ secrets.COMPACT_DATABASE_URL }}
          EXPECTED_DB_REF: gunzsfttzijoxteppskb
        run: python -u load_compact_data.py --input-dir staging/compact --write
      - name: Save failed batch for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-${{ matrix.source }}-${{ matrix.date_from }}
          path: staging/compact
          retention-days: 7

