name: Load notice types into quality flags

# Records KHMDHS noticeType.key, award-reference presence and the fresh
# cancelled flag for a year's notices in public.procurement_quality_flags (only
# that small table is written). The thesis Excel keeps only noticeType
# "Διακήρυξη" (key 3) and drops cancelled notices without an award reference, so
# the stats flag needs all three. Run "test" first (one week, dry run - nothing
# is written), then "full".
on:
  workflow_dispatch:
    inputs:
      mode:
        description: test = one week, dry run; full = the whole year and writes
        required: true
        type: choice
        options:
          - test
          - full
        default: test
      year:
        description: Year to read from KHMDHS (e.g. 2025 or 2026)
        required: true
        type: string
        default: "2026"

permissions:
  contents: read

concurrency:
  group: compact-notice-types
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          MODE: ${{ inputs.mode }}
          YEAR: ${{ inputs.year }}
        shell: python
        run: |
          import json, os
          from datetime import date, timedelta

          year = int(os.environ["YEAR"])
          if os.environ["MODE"] == "test":
              windows = [{"date_from": f"{year}-01-01", "date_to": f"{year}-01-07", "max_pages": 1}]
          else:
              windows = []
              current, end = date(year, 1, 1), min(date(year, 12, 31), date.today())
              while current <= end:
                  window_end = min(current + timedelta(days=6), end)
                  windows.append({"date_from": current.isoformat(), "date_to": window_end.isoformat(), "max_pages": 0})
                  current = window_end + timedelta(days=1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": windows}, separators=(",", ":")) + "\n")

  load:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: notice types ${{ matrix.date_from }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install "requests>=2.32,<3" "psycopg[binary]>=3.2,<4"
      - name: Fetch notice types (and write in full mode)
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.COMPACT_DATABASE_URL }}
          EXPECTED_DB_REF: gunzsfttzijoxteppskb
        run: |
          args=(
            --date-from "${{ matrix.date_from }}"
            --date-to "${{ matrix.date_to }}"
            --max-pages "${{ matrix.max_pages }}"
          )
          if [ "${{ inputs.mode }}" = "full" ]; then
            args+=(--write)
          fi
          python -u load_notice_types.py "${args[@]}"
