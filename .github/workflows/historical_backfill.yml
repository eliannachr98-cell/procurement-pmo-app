name: Historical KHMDHS backfill

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year to backfill"
        required: true
        type: choice
        options:
          - "2025"
          - "2024"
          - "2023"
          - "2022"
          - "2026"
        default: "2025"

      source:
        description: "Source"
        required: true
        type: choice
        options:
          - all
          - notice
          - auction
          - contract
        default: all

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.32,<3" "psycopg[binary]>=3.2,<4"

      - name: Backfill KHMDHS to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backfill_year.py \
            --year "${{ inputs.year }}" \
            --source "${{ inputs.source }}"
