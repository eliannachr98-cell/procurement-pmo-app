name: Refresh dashboard cache

# Recomputes public.dashboard_cache (the Επισκόπηση numbers for "all years", each year and each
# contract type) with the statement timeout off. Takes a few minutes and loads the database.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "psycopg[binary]>=3.2,<4"
      - name: Refresh the cache
        env:
          DATABASE_URL: ${{ secrets.COMPACT_DATABASE_URL }}
          EXPECTED_DB_REF: gunzsfttzijoxteppskb
        shell: python
        run: |
          import os, time
          import psycopg

          url = os.environ["DATABASE_URL"]
          if os.environ["EXPECTED_DB_REF"] not in url:
              raise SystemExit("DATABASE_URL does not point at the expected Supabase project")
          with psycopg.connect(url, prepare_threshold=None, autocommit=True) as connection, connection.cursor() as cursor:
              cursor.execute("set statement_timeout = 0")
              cursor.execute(open("sql/dashboard_aggregates.sql", encoding="utf-8").read())
              print("dashboard_aggregates.sql applied")
              started = time.time()
              cursor.execute("select public.refresh_dashboard_caches()")
              print(f"refreshed in {time.time() - started:.0f}s")
              cursor.execute("select cache_key, payload->'total', (select json_agg(s) from json_array_elements(payload->'status') s where s->>'status' = 'Ακυρωμένος') from public.dashboard_cache where cache_key in ('2024', '2025', '2026', 'all') order by cache_key")
              for row in cursor.fetchall():
                  print(row)
