name: Quality flags report / apply SQL / recompute

# report     = read-only: notices per year by noticeType and how many have no flag row.
# apply-sql  = (re)creates the functions in sql/quality_flags.sql,
#              sql/dashboard_aggregates.sql and sql/market_overview.sql.
# recompute  = runs public.recompute_quality_flags(null) over every notice, then
#              refreshes the dashboard and market overview caches.
# The only rule: a notice counts when its noticeType is 3 ("Διακήρυξη").
on:
  workflow_dispatch:
    inputs:
      mode:
        description: report | compare | apply-sql | reclassify | export | health | recompute
        required: true
        type: choice
        options:
          - report
          - compare
          - apply-sql
          - reclassify
          - export
          - health
          - recompute
        default: report

permissions:
  contents: read

concurrency:
  group: quality-flags
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "psycopg[binary]>=3.2,<4"
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.COMPACT_DATABASE_URL }}
          EXPECTED_DB_REF: gunzsfttzijoxteppskb
          MODE: ${{ inputs.mode }}
        shell: python
        run: |
          import os, time
          from pathlib import Path
          import psycopg

          url = os.environ["DATABASE_URL"]
          if os.environ["EXPECTED_DB_REF"] not in url:
              raise SystemExit("DATABASE_URL does not point at the expected Supabase project")
          mode = os.environ["MODE"]

          def show(cur, title, sql):
              cur.execute(sql)
              print(title)
              for row in cur.fetchall():
                  print(" | ".join(str(v) for v in row))
              print()

          with psycopg.connect(url, prepare_threshold=None, autocommit=True) as conn, conn.cursor() as cur:
              cur.execute("set statement_timeout = 0")
              if mode == "report":
                  show(cur, "year | notices | with flag row | type 3 | other type | no flag row", """
                    select extract(year from p.publication_date)::int as y, count(*),
                           count(g.adam), count(*) filter (where g.notice_type_key = '3'),
                           count(*) filter (where g.adam is not null and g.notice_type_key is distinct from '3'),
                           count(*) filter (where g.adam is null)
                    from public.procurements_compact p
                    left join public.procurement_quality_flags g on g.adam = p.adam
                    where p.publication_date >= '2022-01-01'
                    group by 1 order by 1""")
                  show(cur, "stored flags: notice_type_key | in_stats | rule_version | count", """
                    select coalesce(notice_type_key, 'NULL'), in_stats, rule_version, count(*)
                    from public.procurement_quality_flags group by 1, 2, 3 order by 4 desc""")
              elif mode == "compare":
                  cur.execute("select column_name from information_schema.columns where table_name = 'excel_final_notices' order by ordinal_position")
                  cols = [r[0] for r in cur.fetchall()]
                  print("excel_final_notices columns:", cols)
                  adam_col = next(c for c in cols if "adam" in c.lower())
                  year_col = next(c for c in cols if "year" in c.lower() or c.lower() in ("yr", "etos"))
                  KW = "ΑΠΟΦΑΣ|ΤΡΟΠΟΠ|ΠΑΡΑΤΑΣ|ΔΙΕΥΚΡ|ΜΑΤΑΙΩ|ΔΙΟΡΘΩ|ΑΝΑΡΤΗΣ|ΠΕΡΙΛΗΨ|ΜΕΤΑΘΕΣ|ΠΡΟΣΦΥΓ|ΑΕΠΠ"
                  cur.execute("create temp table cmp_excel as select distinct " + adam_col + "::text as adam, " + year_col + "::int as y from public.excel_final_notices")
                  cur.execute(f"""
                    create temp table cmp_db as
                    select p.adam, extract(year from p.publication_date)::int as y, p.document_category as cat, g.notice_type_key as tk,
                           translate(upper(p.title), 'ΆΈΉΊΌΎΏΪΫ', 'ΑΕΗΙΟΥΩΙΥ') ~ '{KW}' as kw,
                           coalesce(g.cancelled_api, p.status = 'cancelled', false) as canc,
                           coalesce(g.has_award_ref, exists (select 1 from public.awards_compact a where a.procurement_adam = p.adam)) as has_award,
                           coalesce((p.opening_at at time zone 'Europe/Athens')::date < p.publication_date
                                    or (p.opening_at at time zone 'Europe/Athens')::date - p.publication_date > 365, false) as di
                    from public.procurements_compact p
                    join public.procurement_quality_flags g on g.adam = p.adam
                    where p.publication_date >= '2024-01-01' and p.publication_date < '2026-01-01'""")
                  show(cur, "year | excel | db(type3+declaration) | in both | only excel | only db", """
                    select y, (select count(*) from cmp_excel e where e.y = y2.y),
                           (select count(*) from cmp_db d where d.y = y2.y and d.tk = '3' and d.cat = 'declaration'),
                           (select count(*) from cmp_db d join cmp_excel e on e.adam = d.adam and e.y = d.y where d.y = y2.y and d.tk = '3' and d.cat = 'declaration'),
                           (select count(*) from cmp_excel e where e.y = y2.y and not exists (select 1 from cmp_db d where d.adam = e.adam and d.tk = '3' and d.cat = 'declaration')),
                           (select count(*) from cmp_db d where d.y = y2.y and d.tk = '3' and d.cat = 'declaration' and not exists (select 1 from cmp_excel e where e.adam = d.adam))
                    from (select 2024 as y union all select 2025) y2 order by 1""")
                  show(cur, "only in DB (type3+declaration, not in excel): year | title_kw | cancelled_no_award | date_issue | none_of_them", """
                    select d.y, count(*) filter (where d.kw), count(*) filter (where d.canc and not d.has_award),
                           count(*) filter (where d.di), count(*) filter (where not d.kw and not (d.canc and not d.has_award) and not d.di)
                    from cmp_db d where d.tk = '3' and d.cat = 'declaration' and not exists (select 1 from cmp_excel e where e.adam = d.adam)
                    group by d.y order by d.y""")
                  show(cur, "only in Excel: year | not in db at all | other type | type3 but other category", """
                    select e.y, count(*) filter (where d.adam is null), count(*) filter (where d.adam is not null and d.tk is distinct from '3'),
                           count(*) filter (where d.tk = '3' and d.cat <> 'declaration')
                    from cmp_excel e left join cmp_db d on d.adam = e.adam
                    where e.y in (2024, 2025) and not exists (select 1 from cmp_db x where x.adam = e.adam and x.tk = '3' and x.cat = 'declaration')
                    group by e.y order by e.y""")
              elif mode == "apply-sql":
                  for name in ("quality_flags.sql", "scope_condition.sql", "dashboard_aggregates.sql", "market_overview.sql", "reclassify_documents.sql", "watchlists.sql", "interest_news.sql", "publication_nulls_last_index.sql"):
                      cur.execute(Path("sql", name).read_text(encoding="utf-8"))
                      print("applied", name)
              elif mode == "export":
                  import csv
                  cur.execute("""
                    select p.adam, extract(year from p.publication_date)::int, p.publication_date, p.document_category, g.notice_type_key,
                           p.status, g.cancelled_api, p.title
                    from public.procurements_compact p
                    join public.procurement_quality_flags g on g.adam = p.adam
                    where g.notice_type_key = '3' and p.publication_date >= '2024-01-01'
                    order by p.publication_date, p.adam""")
                  with open("app_adams.csv", "w", newline="", encoding="utf-8") as handle:
                      writer = csv.writer(handle)
                      writer.writerow(["adam", "year", "publication_date", "document_category", "notice_type_key", "status", "cancelled_api", "title"])
                      count = 0
                      for row in cur:
                          writer.writerow(row)
                          count += 1
                  print("rows exported:", count)
              elif mode == "health":
                  show(cur, "database size (GB)", "select round(pg_database_size(current_database()) / 1073741824.0, 2)")
                  show(cur, "watchlists: cpv_watchlist rows | authority rows | contractor rows", "select (select count(*) from public.cpv_watchlist), (select count(*) from public.authority_watchlist), (select count(*) from public.followed_contractors)")
                  show(cur, "authorities followed", "select authority_name from public.authority_watchlist")
                  show(cur, "contractors followed", "select contractor_key, contractor_label from public.followed_contractors")
                  show(cur, "tables: name | live rows | dead rows | last autovacuum | last autoanalyze | total size (MB)", """
                    select relname, n_live_tup, n_dead_tup, last_autovacuum, last_autoanalyze, round(pg_total_relation_size(relid) / 1048576.0)
                    from pg_stat_user_tables order by pg_total_relation_size(relid) desc limit 12""")
                  show(cur, "active queries: pid | state | seconds | wait | query", """
                    select pid, state, round(extract(epoch from now() - query_start)), wait_event_type, left(query, 110)
                    from pg_stat_activity where state <> 'idle' and pid <> pg_backend_pid() order by query_start limit 12""")
                  import time as _t
                  for label, sql in [
                      ("top50 by publication_date", "select adam from public.procurements_compact order by publication_date desc nulls last limit 50"),
                      ("count declaration", "select count(*) from public.procurements_compact where document_category = 'declaration'"),
                      ("top50 declaration", "select adam from public.procurements_compact where document_category = 'declaration' order by publication_date desc nulls last limit 50"),
                      ("year 2026 top50", "select adam from public.procurements_compact where publication_date >= '2026-01-01' and publication_date <= '2026-12-31' order by publication_date desc nulls last limit 50"),
                  ]:
                      started = _t.time()
                      cur.execute(sql)
                      cur.fetchall()
                      print(f"timing {label}: {_t.time() - started:.2f}s")
                  cur.execute("explain (analyze, buffers) select adam, title from public.procurements_compact order by publication_date desc nulls last limit 50")
                  for row in cur.fetchall():
                      print("plan:", row[0])
                  cur.execute("select indexname, indexdef from pg_indexes where tablename = 'procurements_compact'")
                  for row in cur.fetchall():
                      print("index:", row[0], "|", row[1][:140])
                  cur.execute("analyze public.procurements_compact")
                  print("analyzed procurements_compact")
                  for label, sql in [
                      ("year2026", "select adam, title from public.procurements_compact where publication_date >= '2026-01-01' and publication_date <= '2026-12-31' order by publication_date desc nulls last limit 50"),
                      ("declaration", "select adam, title from public.procurements_compact where document_category = 'declaration' order by publication_date desc nulls last limit 100"),
                  ]:
                      started = _t.time()
                      cur.execute("explain (analyze, buffers) " + sql)
                      rows = cur.fetchall()
                      print(f"explain {label}: {_t.time() - started:.1f}s")
                      for row in rows[:9]:
                          print("plan2:", row[0][:150])
                  cur.execute("select tablename, indexname, indexdef from pg_indexes where tablename in ('awards_compact','contracts_compact','record_contractors_compact','record_cpvs_compact') order by 1, 2")
                  for row in cur.fetchall():
                      print("idx:", row[0], "|", row[2].split(" USING ")[1][:120] if " USING " in row[2] else row[2][:120])
                  started = _t.time()
                  cur.execute("select (public.market_overview(null, null, null, null, true, null, array['79400000-8','79410000-1'], null, null))->>'tenders'")
                  print("timing market_overview scope(2 cpv):", cur.fetchone()[0], "tenders", round(_t.time() - started, 1), "s")
              elif mode == "reclassify":
                  cur.execute(Path("sql", "reclassify_documents.sql").read_text(encoding="utf-8"))
                  cur.execute("select public.reclassify_document_categories()")
                  print("document categories changed:", cur.fetchone()[0])
                  cur.execute("select public.refresh_dashboard_caches()")
                  print("dashboard caches refreshed")
                  cur.execute("select public.refresh_market_overview_cache()")
                  print("market overview cache refreshed")
              else:
                  started = time.time()
                  cur.execute("select public.recompute_quality_flags(null)")
                  print("flags recomputed:", cur.fetchone()[0], f"in {time.time() - started:.0f}s")
                  cur.execute("select public.refresh_dashboard_caches()")
                  print("dashboard caches refreshed")
                  cur.execute("select public.refresh_market_overview_cache()")
                  print("market overview cache refreshed")
      - name: Upload export
        if: ${{ inputs.mode == 'export' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-adams
          path: app_adams.csv
          retention-days: 3
